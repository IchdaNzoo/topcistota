<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Čistota.cz – Galerie</title>

<style>
/* =====================
   RESET & ZÁKLAD
===================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: #333;
  min-height: 100%;
}

/* =====================
   BACKGROUND
===================== */
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: url('images/background.jpg') center / cover no-repeat;
  position: relative;
}

body::before {
  content:"";
  position: fixed;
  inset:0;
  background: rgba(0,0,0,0.35); /* tmavší overlay jednotný s ostatními stránkami */
  z-index: -1;
}

/* =====================
   HEADER
===================== */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  gap: 20px;
  padding: 15px 20px;
  background: transparent;
}

.logo img {
  height: 250px; /* jednotná velikost loga */
  max-width: 100%;
}

/* =====================
   NAVIGACE
===================== */
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  flex: 1;
  align-items: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  padding: 10px 16px;
  border-radius: 8px;
  background: rgba(255,255,255,0.2);
  transition: 0.3s;
  font-size: 1rem;
}

nav a:hover {
  background: rgba(255,255,255,0.35);
  color: #00c8ff;
}

/* =====================
   MAIN
===================== */
main {
  flex:1; 
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px 30px;
  width: 100%;
  gap: 40px;
  z-index: 1;
}

/* =====================
   CONTENT BOX
===================== */
.gallery-content {
  width: 100%;
  max-width: 1200px;
  background: rgba(255,255,255,0.95); /* jednotný vzhled */
  padding: 50px;
  border-radius: 15px;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  text-align: center;
}

.gallery-content h1 { 
  color: #004d66; 
  font-size: 2.5rem; 
  margin-bottom: 30px; 
}

.gallery-grid {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:20px;
  justify-items:center;
}

.gallery-grid img {
  width:100%; max-width:260px; height:180px;
  object-fit:cover;
  border-radius:15px;
  cursor:pointer;
  transition: transform 0.3s ease;
}

.gallery-grid img:hover {
  transform: scale(1.2);
}

/* =====================
   LIGHTBOX
===================== */
#lightbox {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:100;
}
#lightbox img {
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
.lightbox-arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:60px;
  color:#fff;
  cursor:pointer;
  user-select:none;
  padding:20px;
}
.lightbox-arrow.left { left:20px; }
.lightbox-arrow.right { right:20px; }
.lightbox-arrow:hover { color:#00c8ff; }

/* =====================
   FOOTER
===================== */
footer {
  background: rgba(0,0,0,0.75);
  color:#fff;
  text-align:center;
  padding: 8px 10px; /* jednotný padding */
  font-size:0.75rem; /* menší text */
  flex-shrink:0; /* přilepený ke spodní části */
}

footer a {
  color:#00c8ff;
  text-decoration:none;
}

footer a:hover {
  text-decoration:underline;
}

/* =====================
   RESPONSIVE
===================== */
@media (max-width:1200px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width:900px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width:600px) { .gallery-grid { grid-template-columns: 1fr; } }

@media (max-width:768px) {
  .logo img { height: 180px; }
  nav { justify-content: center; }
}

@media (max-width:480px) {
  .logo img { height: 140px; }
  .gallery-content { padding: 30px 20px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <a href="index.html"><img src="images/logo.png" alt="Top Čistota.cz"></a>
  </div>
  <nav>
    <a href="index.html">Hlavní stránka</a>
    <a href="sluzby.html">Služby</a>
    <a href="cenik.html">Ceník</a>
    <a href="galerie.html">Galerie</a>
    <a href="kontakt.html">Kontakt</a>
  </nav>
</header>

<main>
  <div class="gallery-content">
    <h1>Galerie</h1>
    <div class="gallery-grid">
      <img src="images/gale1.jpg">
      <img src="images/gale2.jpg">
      <img src="images/gale3.jpg">
      <img src="images/gale4.jpg">
      <img src="images/auto1.jpg">
      <img src="images/auto2.jpg">
      <img src="images/auto3.jpg">
      <img src="images/auto4.jpg">
      <img src="images/auto5.jpg">
    </div>
  </div>
</main>

<div id="lightbox">
  <span class="lightbox-arrow left">&#10094;</span>
  <img id="lightbox-img">
  <span class="lightbox-arrow right">&#10095;</span>
</div>

<footer>
  <p>© 2025 Top Čistota.cz – Všechna práva vyhrazena.</p>
  <p>IČO: 21357803 | Tel: <a href="tel:+420605588223">605 588 223</a> | 
     E-mail: <a href="mailto:topcistota@gmail.com">topcistota@gmail.com</a></p>
  <p><a href="gdpr.html">Zásady ochrany osobních údajů (GDPR)</a></p>
</footer>

<script>
const images = document.querySelectorAll('.gallery-grid img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const prev = document.querySelector('.lightbox-arrow.left');
const next = document.querySelector('.lightbox-arrow.right');
let currentIndex = 0;

function showImage(index) {
  currentIndex = index;
  lightboxImg.src = images[currentIndex].src;
}

images.forEach((img, index) => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showImage(index);
  });
});

next.addEventListener('click', e => {
  e.stopPropagation();
  showImage((currentIndex + 1) % images.length);
});

prev.addEventListener('click', e => {
  e.stopPropagation();
  showImage((currentIndex - 1 + images.length) % images.length);
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});
</script>

</body>
</html>
